name: CI

on:
    - pull_request
    - push

jobs:
    verify:
        name: Verify (Node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v4
              with:
                  # fallow resolves its rules against the changed files, so the history has to be there
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm verify
              env:
                  FALLOW_FORMAT: github-annotations

    badges:
        name: Update health and coverage badges
        runs-on: ubuntu-latest
        needs: [verify]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm coverage
            - name: Write badges
              run: |
                  pnpm exec fallow health --format badge --coverage coverage/coverage-final.json > .github/badges/health.svg
                  node -e "const p = require('./coverage/coverage-summary.json').total.lines.pct; console.log(JSON.stringify({ schemaVersion: 1, label: 'coverage', message: p + '%', color: p >= 95 ? 'brightgreen' : p >= 75 ? 'yellow' : 'red' }))" > .github/badges/coverage.json
            - name: Commit badges
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .github/badges/health.svg .github/badges/coverage.json
                  git diff --quiet --cached || git commit -m "chore: update the health and coverage badges [skip ci]"
                  git push
